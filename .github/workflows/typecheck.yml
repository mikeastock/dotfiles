name: Typecheck

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          npm ci --prefix bb-plugins/bb-plugin-t3sidebar
          npm ci --prefix bb-plugins/bb-plugin-tok-speed
          npm ci --prefix bb-plugins/bb-plugin-provider-muse
          npm ci --prefix bb-plugins/bb-plugin-diffr
          npm ci --prefix bb-plugins/bb-plugin-plannotator

      - name: Typecheck
        run: |
          pnpm typecheck
          npm run typecheck --prefix bb-plugins/bb-plugin-t3sidebar
          npm run typecheck --prefix bb-plugins/bb-plugin-tok-speed
          npm run typecheck --prefix bb-plugins/bb-plugin-provider-muse
          npm run typecheck --prefix bb-plugins/bb-plugin-diffr
          npm run typecheck --prefix bb-plugins/bb-plugin-plannotator
