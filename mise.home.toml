#:schema https://mise.jdx.dev/schema/mise.json

# macOS and Ubuntu: claim terminal configs and install brew packages.
# Loaded with `mise -E home` via `make dotfiles` (or `make install DOTFILES=1`) on macOS/Ubuntu.

[dotfiles]
"~/.config/alacritty" = { source = ".config/alacritty", mode = "symlink" }
"~/.config/ghostty" = { source = ".config/ghostty", mode = "symlink" }
"~/.config/starship.toml" = { source = ".config/starship.toml", mode = "symlink" }

[bootstrap.packages]
"brew:tmux" = "latest"
"brew:tmux-mem-cpu-load" = "latest"
"brew:tree-sitter-cli" = "latest"
