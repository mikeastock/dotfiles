interface:
  display_name: "PR Babysitter"
  short_description: "Watch Greptile, Codex, Cursor Bugbot, CI, and conflicts"
  default_prompt: "Babysit the current PR using gh only. Load better-github-skill and use pr-snapshot plus pr-threads --all --full on every poll to fetch all published feedback, CI, mergeability, and conflicts; use the watcher’s --watch mode for continuous monitoring. Independently judge every substantive human or bot comment: fix valid issues, post concise [agent] evidence-based pushback for invalid, obsolete, or out-of-scope findings, and resolve a thread only after all its points and follow-ups are handled. Ask the user only for ambiguous or product-level decisions. Never use a harness GitHub connector. Do not call the PR review-green until CI is green for the current SHA, GitHub has no blocking review decision, all feedback has a disposition, and all actionable threads are resolved. Do not patch unrelated flaky tests or infrastructure failures. Keep exactly one watcher active; after any patch and push, restart --watch in the same turn and continue until the PR closes, user help is required, or the user interrupts."
