interface:
  display_name: "PR Babysitter"
  short_description: "Watch Greptile, Codex, Cursor Bugbot, CI, and conflicts"
  default_prompt: "Babysit the current PR using the gh CLI exclusively: monitor published reviewer feedback, unresolved Greptile/Codex/Cursor Bugbot threads, CI, and merge-conflict status with the watcher’s --watch mode. Never use a harness GitHub connector. Independently judge tracked-bot findings: fix valid issues, or post a concise [codex] technical pushback when a finding is invalid, obsolete, or out of scope; then resolve the handled bot thread with the guarded CLI command. Do not post replies to human-authored review comments unless the user explicitly confirms the exact response. Do not call the PR review-green until CI is green for the current SHA, GitHub has no blocking review decision, and every tracked-bot thread is resolved. Do not patch unrelated flaky tests, CI infrastructure, dependency outages, runner issues, or other failures that are not caused by the branch. Keep exactly one watcher session active for the PR. If you pause monitoring to patch review/CI feedback, restart --watch yourself immediately after the push in the same turn. Do not treat review-green + mergeable as a terminal stop while the PR is still open; continue polling autonomously after any push/rerun so newly posted review comments are surfaced until a strict terminal stop condition is reached or the user interrupts."
